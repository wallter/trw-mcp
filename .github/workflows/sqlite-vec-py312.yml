name: sqlite-vec on Python 3.12/3.13

# PRD-SEC-019 FR01: ci.yml pins Python 3.11 because "sqlite-vec segfaults on GitHub Actions
# Ubuntu runners" (2026-03-25; no root cause recorded). This workflow proves or disproves
# that on ubuntu-latest with Python 3.12 and 3.13. It runs only when dispatched by hand;
# ci.yml and requires-python move to 3.12 only after a green run here, with its URL cited.
#
# tier: .github/scripts/sqlite_vec_tier.py (a direct sqlite-vec/vec0 probe, a trw-memory
#       backend vector round trip, then the test modules that store vectors through it).
# full: the tier, then the whole suite, which is what ci.yml would run on 3.12.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "tier (sqlite-vec tier only) or full (tier, then the whole suite)"
        type: choice
        options: [tier, full]
        default: tier
      trw_memory:
        description: "optional pip requirement for trw-memory when this ref needs an unreleased one, e.g. git+https://github.com/wallter/trw-memory@main"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sqlite-vec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      TRW_REQUIRE_SQLITE_VEC: "1"
      TRW_MEMORY_REQUIREMENT: ${{ inputs.trw_memory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -n "$TRW_MEMORY_REQUIREMENT" ]; then pip install "$TRW_MEMORY_REQUIREMENT"; fi
          pip install -e ".[dev]"
      - name: Record the environment
        run: |
          python -VV
          python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"
          ldd --version | head -1
          pip show sqlite-vec trw-memory | grep -E '^(Name|Version)'
      - name: sqlite-vec tier
        run: python .github/scripts/sqlite_vec_tier.py -n auto
      - name: Full suite
        if: inputs.suite == 'full'
        run: python -X faulthandler -m pytest tests/ -q -n auto
