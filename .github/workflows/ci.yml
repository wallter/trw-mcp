name: CI

# What runs where (PRD-INFRA-188 Amendment 01):
# - Pull requests and manual dispatches run this workflow at the package baseline
#   suite (unit); the full suite is too slow for every pull request. A dispatch can pick either suite.
# - The tag-triggered release.yml calls this workflow with suite=full, and publish
#   waits for it: the package's full pytest suite on Linux gates every release.
# - A push to main (a release sync) does not run it; the monorepo's
#   `release_public.py check` replays these steps locally before the cut, and its
#   Linux leg runs the full suite in a container when Docker is available.
# - release.yml also keeps the multi-OS installed-wheel smoke test.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "unit or full"
        type: choice
        options: [unit, full]
        default: unit
      correlation_id:
        description: "set by release_public.py all so it can find this exact run"
        type: string
        default: ""
  workflow_call:
    inputs:
      suite:
        type: string
        default: unit

run-name: ${{ inputs.correlation_id && format('CI {0}', inputs.correlation_id) || github.event.pull_request.title || 'CI' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # 3.12+ excluded: sqlite-vec C extension segfaults on GH Actions runners
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check src/
      - name: Format check (ruff format --check)
        run: ruff format --check src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # 3.12+ excluded: sqlite-vec C extension segfaults on GH Actions runners
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # fastmcp >=3.2 ships py.typed (inline types) so --strict resolves on CI runners.
      - name: Type check (mypy --strict)
        run: mypy --strict src/trw_mcp/

  test:
    runs-on: ubuntu-latest
    env:
      TRW_SUITE: ${{ inputs.suite || 'unit' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # 3.12+ excluded: sqlite-vec C extension segfaults on GH Actions runners
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The unit tier (no filesystem I/O) is the pull-request baseline. Coverage is
      # reported for visibility but not gated: a unit-only run cannot reach the
      # whole-package threshold. The suite marker is written only after pytest
      # succeeds (&&, so a failing run never writes it, even under bash without -e).
      - name: Test (unit tier) with coverage
        if: env.TRW_SUITE != 'full'
        run: >-
          pytest tests/ -m unit -q
          --cov=trw_mcp
          --cov-report=term-missing
          --cov-fail-under=0
          --junitxml=junit.xml
          && echo unit > suite-ran.txt
      # Every marker, every test: what release.yml gates publication on.
      - name: Test (full suite)
        if: env.TRW_SUITE == 'full'
        run: pytest tests/ -q -n auto --junitxml=junit.xml && echo full > suite-ran.txt
      - name: Verify the requested suite ran
        run: python .github/scripts/verify_suite.py --requested "$TRW_SUITE" --junit junit.xml --marker suite-ran.txt

  # PRD-QUAL-141: host-resource budgets (wall-clock, throughput, RSS) are skipped in the gating
  # suite on a runner and measured HERE, with CI and GITHUB_ACTIONS unset. Non-gating three ways:
  # continue-on-error, no job needs it, and the script exits 0 with the outcome as a status in the
  # uploaded artifact. It is not part of what release.yml's publish waits on.
  timing:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Measure host-resource budgets (non-gating)
        run: python .github/scripts/timing_job.py --out timing-results.json
      - name: Upload timing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-results
          path: |
            timing-results.json
            timing-junit.xml
          if-no-files-found: warn
