# Workflow nudge pool — task-scoped engineering advice.
# PRD-CORE-129: Selected via weighted random by the nudge pool system.
# Content guidance (nudge-deep-dive 2026-06-14): each message points at a
# CONCRETE artifact (a test, source location, owned diff, or boundary value).
# The selector knows the phase, not the task's permissions or whether a test
# is failing. Keep task-specific advice conditional and preserve entry IDs
# for attribution. Content-contract tests do not establish model-level benefit.
messages:
  - id: read_test_first
    text: "If the task includes a failing test, inspect its expected behavior before implementing the fix."
    phase_hint: early
  - id: verify_with_targeted_check
    text: "For a bug fix, re-run the failing test first; a targeted pass does not replace the task's required validation."
    phase_hint: validate
  - id: minimize_changes
    text: "Inspect your own diff against the task's scope; preserve unrelated work from the user or other contributors."
    phase_hint: implement
  - id: explain_root_cause
    text: "For a bug fix, trace the observed failure to its source before editing; distinguish evidence of the cause from a hypothesis."
    phase_hint: implement
  - id: check_edge_cases
    text: "Check edge cases for the input this code handles: empty, None, and boundary values at the exact limits in the spec."
    phase_hint: implement
  - id: dont_modify_tests
    text: "Add or update tests when the task permits; do not weaken assertions merely to make failing code pass."
    phase_hint: implement
