# AI-facing messages — single source of truth for TRW messaging to AI instances.
# PRD-INFRA-012: Centralized AI-Facing Messaging Registry with Value-Oriented Framing.
#
# Framing principle: value-oriented (what it gives you) > prescriptive (MUST/ALWAYS/NEVER).
# Research basis: context engineering, motivation framing, and instruction portability — understanding enables generalization to novel situations.
#
# Consumed by:
#   - Python: trw_mcp.prompts.messaging loads this file via get_message()
#   - Deployed to user projects as .trw/context/messages.yaml via bootstrap
#
# Format: simple YAML strings. Avoid block scalars (> |) for shell grep-ability.
# Use {placeholder} for runtime substitution via str.format().

# --- MCP Server Instructions (server.py FastMCP constructor) ---
#
# BUDGET: Claude Code truncates server instructions at 2KB, and under its
# default tool-schema deferral this string is one of only TWO things loaded at
# session start (the other being the bare tool NAMES). Measured 2026-07-28:
# 1,349 chars served with bare names, 1,609 rendered for claude-code (the
# mcp__trw__ prefix costs ~10 chars per {tool:} placeholder). Keep the
# claude-code rendering under 2048 — that is the binding figure, not the raw
# YAML length. Pinned by tests/test_server_instructions_budget.py.
#
# The second paragraph is a ROUTING MAP, not decoration. Deferral loads the
# names but not the descriptions, so `trw_ordering_compare` arrives as an
# opaque token; naming the families converts the loaded name list into
# something the agent can navigate, and tells it which words to search when it
# needs a schema it does not have.
server_instructions: "TRW provides persistent engineering memory. Call {tool:trw_session_start}() first; use a query for focused recall. Read .trw/frameworks/FRAMEWORK-CORE.md for execution and quality gates; re-read after compaction. Preserve material unfinished work via {tool:trw_checkpoint} or durable native handoff with a next-read pointer. Nothing material to preserve: no artifact needed. {tool:trw_deliver} is completed-work acceptance under unchanged delivery gates, not required for preservation. Recorded learnings already persist.\nYour client may load tool schemas on demand. If one you need is not loaded, search for it by these words. Memory, recall and prior context: {tool:trw_recall}, {tool:trw_learn}, {tool:trw_learn_update}, {tool:trw_graph_related}. Run lifecycle, progress and resume: {tool:trw_init}, {tool:trw_status}, {tool:trw_checkpoint}, {tool:trw_heartbeat}. Validation, review verdicts and delivery gates: {tool:trw_build_check}, {tool:trw_review}, {tool:trw_deliver}. Requirements and PRDs: {tool:trw_prd_create}, {tool:trw_prd_validate}, {tool:trw_prd_diff}. Code search, symbols, risk and blast radius: {tool:trw_code_search}, {tool:trw_code_symbol}, {tool:trw_before_edit_hint}, {tool:trw_codebase_risk_report}. Skills, config profiles and masked-tool access: {tool:trw_skill_discovery}, {tool:trw_profile_explain}, {tool:trw_request_tool_access}."

# --- Ceremony Middleware Warning (prepended to tool responses when ceremony not run) ---
ceremony_warning: "{tool:trw_session_start}() has not been called yet for this session.\nWithout it, you are working without:\n  - Prior session learnings (patterns and gotchas that prevent re-work)\n  - Active run state (phase, progress, last checkpoint)\nCall {tool:trw_session_start}(query='your task domain') now — pass a query for focused recall, or call without args for default high-impact recall."

# --- Delegation Guidance (CLAUDE.md auto-generated section, session-start hint) ---
