# Token pricing table — PRD-HPO-MEAS-001 FR-4 + FR-13 §3.
#
# The pricing_version string is stamped on every ToolCallEvent so cost
# estimates remain reproducible across pricing-table edits. Bump
# `version` when any model's rates change so historical cost reports
# know which table was in effect.
#
# Rates are USD per 1K tokens, matching Anthropic's public pricing page.
# Conventions across every row: cache_write = 1.25x input (5-minute TTL),
# cache_read = 0.1x input -- EXCEPT the Fable/Mythos 5.1 line, whose cache
# reads are 0.025x input. Do not assume 0.1x when adding a row; check the
# vendor page. (Verified 2026-09-10.)
#
# Keys are bare model aliases. The lookup normalises the incoming id
# before matching (telemetry/tool_call_timing.py::_usd_cost_estimate), so
# a dated snapshot, a `[1m]` long-context rendering, a Vertex `@`-pin, and
# Bedrock's `anthropic.` / `us.anthropic.` prefixes all resolve to their
# family's row. Do NOT add spelling variants as separate keys.
#
# A model absent from this table estimates at $0.00 and logs
# `pricing_model_unknown` once per distinct id. Add the row rather than
# leaving a real cost reported as free.

version: "2026-09-10"

models:
  # --- Frontier tier -------------------------------------------------
  claude-fable-5:
    input_per_1k: 0.010
    output_per_1k: 0.050
    cache_write_per_1k: 0.0125
    cache_read_per_1k: 0.001

  # Same capabilities, pricing and API surface as Fable 5; Project
  # Glasswing distribution only.
  claude-mythos-5:
    input_per_1k: 0.010
    output_per_1k: 0.050
    cache_write_per_1k: 0.0125
    cache_read_per_1k: 0.001

  # trw:intentional Released 2026-09-01. Same $10/$50 sticker as Fable 5, but
  # cache reads are 0.025x input, NOT the 0.1x every other row uses -- the one
  # place this table's stated convention does not hold. An explicit key is
  # required: without it the `-`-boundary prefix match resolves
  # `claude-fable-5-1` onto `claude-fable-5` and over-reports cache reads 4x.
  # Source: platform.claude.com/docs/en/models/fable-5-1/whats-new-fable-5-1
  claude-fable-5-1:
    input_per_1k: 0.010
    output_per_1k: 0.050
    cache_write_per_1k: 0.0125
    cache_read_per_1k: 0.00025

  # ASSUMED identical to Fable 5.1, NOT independently sourced. Mythos is invite-only
  # (Project Glasswing), so its cache-read rate has no public page to cite the way
  # Fable 5.1's does. The 0.025x below is inherited from its sibling on the strength
  # of the corpus describing the two as sharing specs and pricing — treat as a
  # working assumption and re-check if a Mythos cost estimate ever matters.
  claude-mythos-5-1:
    input_per_1k: 0.010
    output_per_1k: 0.050
    cache_write_per_1k: 0.0125
    cache_read_per_1k: 0.00025

  # --- Opus tier ($5/$25 per MTok across the whole line) --------------
  claude-opus-5:
    input_per_1k: 0.005
    output_per_1k: 0.025
    cache_write_per_1k: 0.00625
    cache_read_per_1k: 0.0005

  claude-opus-4-8:
    input_per_1k: 0.005
    output_per_1k: 0.025
    cache_write_per_1k: 0.00625
    cache_read_per_1k: 0.0005

  # Corrected 2026-07-26: this row previously carried 0.015/0.075
  # ($15/$75 per MTok) — Claude Opus 4.1's rates, not 4.7's — and so
  # over-reported every Opus cost estimate by 3x.
  claude-opus-4-7:
    input_per_1k: 0.005
    output_per_1k: 0.025
    cache_write_per_1k: 0.00625
    cache_read_per_1k: 0.0005

  claude-opus-4-6:
    input_per_1k: 0.005
    output_per_1k: 0.025
    cache_write_per_1k: 0.00625
    cache_read_per_1k: 0.0005

  # --- Sonnet tier ---------------------------------------------------
  # Standard rates. Sonnet 5 carries introductory pricing of $2/$10 per
  # Corrected 2026-09-10: this row previously held 0.003/0.015 on the premise
  # that $2/$10 was introductory through 2026-08-31 and $3/$15 was the durable
  # rate. That premise is false. Anthropic's pricing page (note id
  # `claude-sonnet-5-introductory-pricing`) states the $2/$10 rate "is now the
  # standard price" and "the previously scheduled increase to $3/$15 ... on
  # September 1, 2026 will not occur." The old row over-reported every Sonnet 5
  # cost estimate by 1.5x. Batch table ($1/$5) agrees.
  claude-sonnet-5:
    input_per_1k: 0.002
    output_per_1k: 0.010
    cache_write_per_1k: 0.0025
    cache_read_per_1k: 0.0002

  claude-sonnet-4-6:
    input_per_1k: 0.003
    output_per_1k: 0.015
    cache_write_per_1k: 0.00375
    cache_read_per_1k: 0.0003

  # --- Haiku tier ----------------------------------------------------
  # Corrected 2026-07-26: previously 0.0008/0.004 ($0.80/$4.00 per MTok).
  claude-haiku-4-5:
    input_per_1k: 0.001
    output_per_1k: 0.005
    cache_write_per_1k: 0.00125
    cache_read_per_1k: 0.0001

  # --- Still-active earlier generations ------------------------------
  # Present so a call on one of these is priced rather than silently
  # estimated at $0.00. Opus 4.1 in particular is 3x the rest of the
  # Opus line and retires 2026-08-05.
  claude-opus-4-5:
    input_per_1k: 0.005
    output_per_1k: 0.025
    cache_write_per_1k: 0.00625
    cache_read_per_1k: 0.0005

  claude-sonnet-4-5:
    input_per_1k: 0.003
    output_per_1k: 0.015
    cache_write_per_1k: 0.00375
    cache_read_per_1k: 0.0003

  claude-opus-4-1:
    input_per_1k: 0.015
    output_per_1k: 0.075
    cache_write_per_1k: 0.01875
    cache_read_per_1k: 0.0015
