[build-system]
# Pinned below 1.29: hatchling 1.29+ stamps Metadata-Version 2.5, which twine 7.0 /
# packaging 26.3 reject ("'2.5' is not a valid metadata version"). Every wheel we
# have published carries 2.4. Re-verified 2026-09-05 in the release rehearsal.
# Exact since R9 #8: the signed tag attests the wheel's sha256, and the mirror rebuilds it; both
# isolated builds must resolve the same backend or every publish fails closed. Bump deliberately.
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "trw-mcp"
version = "8.1.3"
description = "Engineering memory MCP server for Claude Code — patterns, gotchas, and project knowledge that persist across sessions"
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.11"
authors = [
    { name = "TRW Framework", email = "noreply@trwframework.com" },
]
keywords = ["mcp", "claude", "agent", "orchestration", "developer-tools", "engineering-memory", "knowledge-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # Direct floor (PRD-CORE-274 Amendment 01, FR11): comms/_wait.py imports
    # `anyio.NoEventLoopError`, first exposed in 4.11.0 (measured 4.5.0–4.10.0 lack
    # it and raise a bare RuntimeError). Resolutions on AnyIO 4.5–4.10 are no
    # longer supported; the catch is deliberately not widened to compensate.
    "anyio>=4.11.0",
    "cryptography>=48.0.1",
    "fastmcp>=3.4.0,<4.0.0",
    "httpx>=0.27.0",
    "mcp>=1.26.0",
    # PRD-CORE-342 FR01: the one OTel API floor (already transitive via fastmcp-slim[client]).
    "opentelemetry-api>=1.38,<2",
    # PRD-CORE-347-NFR02: trw_mcp.handoff validates Agent Handoff Records against the packaged
    # JSON Schema 2020-12. Declared, not left transitive via mcp; listed after mcp so the
    # mcp pin line that PRD-CORE-317 cites does not move.
    "jsonschema>=4.18.0",
    "packaging>=24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "PyYAML>=6.0.0",
    "ruamel.yaml>=0.18.0",
    # Dense (vector) recall is on for every install (6.1.0 / 3.1.0): sqlite-vec is a
    # base dependency of both packages (state/memory_store.py imports it directly),
    # not the old [vectors] extra that a default install skipped.
    # 0.1.5 is the first release with a manylinux aarch64 wheel. No release ships a
    # musllinux wheel or an sdist, so musl (Alpine) and Windows ARM fail at pip time:
    # an install failure is truthful where silently keyword-only recall is not.
    "sqlite-vec>=0.1.5",
    "starlette>=1.3.1",
    "structlog>=24.0.0",
    # Floor 0.16.0 is the lowest release carrying `trw_memory.user_paths`, which
# `state/_user_paths.py` now re-exports as the single user-space resolver
# (PRD-CORE-253 FR01), and `trw_memory.daemon`. The previous floor, 0.12.0, was
# the lowest release carrying the `verification_status` field and
    # its additive schema migration, which tools/_maintain_verify.py and
    # tools/_recall_assertion_verification.py both consume (PRD-CORE-231). 0.11.0 was
    # the previous floor, for token_budget.estimate_serialized_entry_tokens — imported
    # UNGUARDED by _recall_impl.py — plus the earlier hard deps rrf_fuse(importances=)
    # and SQLiteBackend.find_active_by_content. A lower floor lets pip resolve an older
    # trw-memory that satisfies the constraint but lacks the symbol, so the call raises
    # at runtime; the floor makes the skew fail fast at install instead. When adding an
    # import from a new trw-memory symbol, bump this floor IN THE SAME PR.
    #
    # RELEASE ORDER (docs/deployment/AGENTS.md): trw-memory ships FIRST. This floor
    # resolves from PyPI as of 2026-07-30 — the 0.11.0-era block described here
    # earlier has cleared. Read the current published version from PyPI rather than
    # from this comment, which has been wrong before.
    # Do NOT lower the floor to make the lock or its parity tests pass — that
    # reinstates exactly the runtime skew the floor exists to prevent.
    # 5.0.0: the trw-memory major that ships with trw-mcp 8.0.0 (R8) and the first
    # release exporting `trw_memory.storage.probe_store` (PRD-QUAL-147 FR08; 4.0.1
    # does not). Unpublished when raised: the lock follows after trw-memory ships,
    # and release_cut_prep.py re-derives the final pin. The floor's major is never
    # behind trw-memory's own version (test_mcp_version_source.py guards it).
    # 5.1.0 also carries `trw_memory.safe_fs.write_beneath(exact_mode=)`, which _checkout_write.write_checkout_file
    # passes UNGUARDED (SAFE-WRITE-MODE-EDGES); 5.0.x raises TypeError on it.
    # 5.1.0 also carries `trw_memory.security.credentials` (the one credential detector,
    # E2E-INC-036), imported UNGUARDED by telemetry/anonymizer.py; if this ships after
    # trw-memory 5.1.0 is published, raise the floor to the release that carries it.
    "trw-memory>=5.1.2,<6.0.0",
    "typing_extensions>=4.6.0",
]

[project.optional-dependencies]
sqlite-fix = [
    # OPT-IN engine override, not a fix that ships. Measured 2026-09-16:
    # pysqlite3-binary 0.5.4.post2 bundles SQLite 3.51.1, BELOW the 3.51.3
    # WAL-reset fix it was added here to deliver, and it publishes exactly one
    # wheel (manylinux2014_x86_64) — so it made aarch64 Linux installs fail
    # outright while delivering nothing on x86_64. It is now optional and marked
    # for the one platform that has a wheel; on macOS, Windows and arm64 Linux
    # this extra resolves to nothing and the install still succeeds.
    #
    # Installing it does not necessarily change the engine: storage/_dbapi.py
    # ranks candidates on (carries the WAL-reset fix, version) and keeps the
    # interpreter's own SQLite when the wheel is older, which it is on any
    # current CPython.
    "pysqlite3-binary>=0.5.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
meta-tune = [
    # PRD-HPO-SAFE-001 sandbox hardening (Linux only). This extra is OPTIONAL only in
    # the sense that meta_tune is off by default (`meta_tune.enabled=false`), so a
    # normal install neither needs nor loads it.
    #
    # It does NOT degrade gracefully once meta_tune IS enabled: `boot_checks`
    # validate_defaults raises MetaTuneBootValidationError and `_app._build_middleware`
    # calls it unguarded, so the server refuses to start without pyseccomp. That is
    # deliberate and correct for a sandbox control -- a hardening feature that quietly
    # runs unhardened is worse than one that refuses -- but the comment here used to
    # promise the opposite ("degrades gracefully when unavailable"), which is how the
    # contradiction survived: nobody hits it in development because the dev venv has
    # pyseccomp installed. Corrected 2026-09-11.
    "pyseccomp>=0.1.2; sys_platform == 'linux'",
    "psutil>=5.9.0",
]
# PRD-CORE-342 FR01: the SDK and OTLP/HTTP exporter come from trw-memory[otel], whose otel_setup is
# the one SDK-setup module. Installing the extra never enables export (TRW_OTEL_ENABLED=false).
otel = [
    "trw-memory[otel]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.11.0,<2.0",  # pin to the 1.x line: mypy 2.x is a major release with behavior changes (set-literal `in` narrowing, stricter unused-ignore) that a raw `pip install .[dev]` would otherwise resolve (2.3.0), diverging from the verified uv.lock (1.20.2). Migrate to 2.x deliberately, not via CI drift.
    "types-pyyaml>=6.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.15.0,<0.16",  # CI installs .[dev]; a newer minor adds rules the repo has not adopted yet
    "pip-audit>=2.7.0",
    "vulture>=2.11",
    "deptry>=0.21.0",
    "defusedxml>=0.7.1",  # PRD-SEC-020 FR06: .github/scripts/{timing_job,verify_suite}.py parse fork-PR-triggered JUnit XML with this instead of stdlib xml.etree
    "opentelemetry-sdk>=1.38,<2",  # PRD-CORE-342 FR09: the in-memory-exporter test fixture
    "build>=1.2.0",  # PRD skip-audit D5: lets the installer-build test fixture run `python -m build --wheel` without a repo-wide install
    # Backend for --no-isolation wheel builds under `build` above. MUST match the
    # [build-system] requires pin in trw-mcp/pyproject.toml AND trw-memory/pyproject.toml
    # exactly (hatchling 1.29+ stamps Metadata-Version 2.5, which twine/packaging reject)
    # — --no-isolation uses the venv's installed hatchling instead of an isolated one,
    # so a looser pin here silently breaks the D5 build fixture.
    "hatchling==1.28.0",
]
ai = [
    "anthropic>=0.40.0",
]

[project.urls]
Homepage = "https://trwframework.com"
Documentation = "https://trwframework.com/docs"
Repository = "https://github.com/wallter/trw-mcp"
Issues = "https://github.com/wallter/trw-mcp/issues"
Changelog = "https://trwframework.com/docs/changelog"

[project.scripts]
trw-mcp = "trw_mcp.server:main"
trw-mcp-proxy = "trw_mcp.shared_server:main_proxy"

[tool.hatch.build.targets.wheel]
# The wheel needs the SAME exclusions as the sdist below. Hatchling applies
# excludes PER TARGET, so listing them only under `sdist` left every internal
# sub-CLAUDE.md in the artifact `pip install` actually delivers — confirmed
# against the published 2.0.0 wheel's RECORD. That is not merely untidy: these
# docs state which security controls are unwired (`security/AGENTS.md`: verify
# fn is an observe-mode stub, capability_scope not wired, kill switches default
# off) and cite internal PRD paths. Found in pre-release review, 2026-09-11.
packages = ["src/trw_mcp"]
exclude = ["/CHANGELOG.md", "**/CLAUDE.md", "**/AGENTS.md"]

[tool.hatch.build.targets.sdist]
# Defense in depth alongside .gitignore: hatchling honors the package-local
# .gitignore but NOT a global git excludesfile, so dev/runtime artifacts and
# monorepo-internal files must be excluded explicitly here too — they must
# never ship in the published sdist or the public subtree-split mirror.
exclude = [
  "/CHANGELOG.md",
  "meta",
  "*.jsonl",
  "uv.lock",
  "CLAUDE.md",
  "AGENTS.md",
  "FRAMEWORK.md",
  "REVIEW.md",
  "docs",
  "scratch",
]

[tool.pyright]
include = ["src/trw_mcp"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.deptry]
known_first_party = ["trw_mcp"]
optional_dependencies_dev_groups = ["dev"]
extend_exclude = ["scripts/install-trw.template.py"]
package_module_name_map = { "opentelemetry-api" = "opentelemetry" }

[tool.deptry.per_rule_ignores]
# Starlette is an intentional direct security-floor pin for FastMCP's transitive web surface.
DEP002 = ["starlette"]

[tool.ruff]
# Style target, NOT the support floor (requires-python is >=3.11). Raising it to py311 makes ruff want
# ~850 mechanical rewrites (datetime.UTC, StrEnum); do that as its own sweep.
target-version = "py310"
line-length = 120
exclude = ["scripts/install-trw.template.py", "scripts/build_installer.py"]

[tool.ruff.lint]
select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # Pyflakes: unused imports, undefined names, unused vars
    "I",        # isort: consistent import ordering
    "B",        # flake8-bugbear: B014 duplicate exception, B006 mutable defaults
    "UP",       # pyupgrade: modernize to Python 3.10+ syntax
    "SIM",      # flake8-simplify: nested-if, contextlib.suppress
    "RET",      # flake8-return: assign-then-return, superfluous else
    "PIE",      # flake8-pie: unnecessary pass, duplicate class field
    "TRY",      # tryceratops: verbose raise, raise-in-try
    "ASYNC",    # flake8-async: blocking I/O in async functions
    "PT",       # flake8-pytest-style: fixture/assert/exception style
    "TC",       # flake8-type-checking: move type-only imports to TYPE_CHECKING
    "RUF",      # Ruff-native: mutable ClassVar, unused noqa
    "C4",       # flake8-comprehensions: unnecessary list/dict comprehension
    "PERF",     # performance anti-patterns
    "G",        # flake8-logging-format: logging format strings
    "S",        # bandit: security checks
    "DTZ",      # flake8-datetimez: timezone-aware datetime
    "FURB",     # refurb: modern Python idioms
    "C901",     # McCabe complexity
    "ANN",      # flake8-annotations: type annotations
]
ignore = [
    "E501",     # line too long — handled by line-length setting
    "TRY003",   # long exception messages inline are fine
    "TRY002",   # raising ValueError/TypeError directly is idiomatic
    "TRY300",   # return-in-try is standard handler pattern
    "TRY301",   # raise-within-try is sometimes the cleanest error-wrap pattern
    "SIM108",   # ternary not always more readable
    "SIM105",   # contextlib.suppress vs try/except/pass is a style choice; codebase chooses try/except
    "RET504",   # assign-then-return is often clearer
    "TC001",    # typing imports used at runtime via Pydantic — not type-checking-only
    "TC002",    # third-party imports used at runtime — not type-checking-only
    "TC003",    # stdlib imports used at runtime — not type-checking-only
    "B008",     # function calls in defaults — FastMCP/Pydantic patterns use this idiomatically
    "ISC001",   # conflicts with formatter
    "ANN401",   # Any annotations are intentional at JSON/config/MCP-boundary surfaces
    "PERF203",  # try-except inside loops is required for per-item error handling
    "S110",     # try-except-pass is the codebase's fail-open pattern (CONSTITUTION §1)
    "C901",     # McCabe complexity is a code-review concern; max-complexity already capped at 15
    "RUF001",   # ambiguous unicode in strings (typography/math glyphs are intentional)
    "RUF002",   # ambiguous unicode in docstrings (math glyphs intentional)
    "RUF003",   # ambiguous unicode in comments (math glyphs intentional)
]
fixable = ["F401", "B007", "B013", "B014", "UP", "I", "PIE790", "PIE810", "TC", "RUF100", "RUF022", "RUF023", "SIM110", "SIM102", "SIM300", "PERF401", "TRY400", "C401", "C420", "B905"]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT", "TRY", "SIM", "B018", "RUF012", "F841", "F821", "F811", "E741", "B017", "RUF059", "B905", "UP031", "RUF009", "RUF015", "B009", "E402", "ASYNC240", "RET501", "ANN", "S101", "S1", "S3", "S6", "T201", "W", "B023", "G", "PERF", "FURB171"]
"tests/test_scoring_properties.py" = ["DTZ001"]  # hypothesis st.datetimes() requires naive bounds when timezones= is provided
"**/__init__.py" = ["F401"]
"**/conftest.py" = ["PT"]
# Structlog logger-before-imports pattern and Any for logger param (structlog convention)
"src/trw_mcp/_logging.py" = ["ANN401", "S110"]
# Sandbox primitive — subprocess + /tmp paths are intrinsic to the sandbox purpose
"src/trw_mcp/meta_tune/sandbox.py" = ["S603", "S108"]
# Dispatch runner — launching another coding-agent CLI is the module's whole purpose;
# argv is a list (shell=False), env is sanitized/allowlisted, prompt is a single token.
"src/trw_mcp/dispatch/_runner.py" = ["S603", "S607"]
# Dispatch job registry — spawns the detached _run_job child via [sys.executable,
# "-m", ...]; argv is a fixed list (shell=False), only paths we created are appended.
"src/trw_mcp/dispatch/_jobs.py" = ["S603"]
"src/trw_mcp/audit.py" = ["E402"]
"src/trw_mcp/resources/config.py" = ["E402"]
"src/trw_mcp/resources/run_state.py" = ["E402"]
"src/trw_mcp/state/dry_check.py" = ["E402"]
"src/trw_mcp/state/receipts.py" = ["E402"]
"src/trw_mcp/state/_nudge_messages.py" = ["E402"]
"src/trw_mcp/tools/build/_audit.py" = ["E402"]
"src/trw_mcp/tools/build/_core.py" = ["E402"]
"src/trw_mcp/tools/build/_runners.py" = ["E402"]
"src/trw_mcp/tools/orchestration.py" = ["E402"]
"src/trw_mcp/tools/requirements.py" = ["SIM105"]
# Bootstrap update uses conditional imports after function-level setup
"src/trw_mcp/bootstrap/_update_project.py" = ["E402", "S110", "F841"]
# Backward-compat re-exports placed after class definitions — can't move to top
"src/trw_mcp/tools/_learning_helpers.py" = ["E402"]
# Injectable test-seam parameters use Any for callability without protocol overhead
"src/trw_mcp/tools/_learn_impl.py" = ["ANN401"]
"src/trw_mcp/tools/_recall_impl.py" = ["ANN401"]
# register_learning_tools has 16 inner tool registrations — complexity is structural
"src/trw_mcp/tools/learning.py" = ["C901"]
# correlate_recalls and _get_last_active_run are algorithmic — complexity is inherent
"src/trw_mcp/scoring/_correlation.py" = ["C901"]
# rank_targeted_by_utility applies 10+ scoring boosts in sequence — structural complexity
"src/trw_mcp/scoring/_recall.py" = ["C901"]
# _populate_from_yaml parses multi-format YAML schemas — structural complexity
"src/trw_mcp/state/artifact_scanner.py" = ["C901"]
# _step_delivery_metrics collects metrics from 10+ sources — structural complexity
"src/trw_mcp/tools/_deferred_steps_learning.py" = ["C901"]
# perform_session_recalls coordinates focused, baseline, and pressure paths — structural complexity
"src/trw_mcp/tools/_session_recall_helpers.py" = ["C901"]
# Backward-compat re-exports for _template_updater decomposition
"src/trw_mcp/bootstrap/_template_updater.py" = ["E402"]
# Large TypedDict registry — Codex entries grouped logically, not alphabetically
"src/trw_mcp/models/typed_dicts/__init__.py" = ["RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["trw_mcp"]
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

# Optional C extensions that may not be installed in CI. pysqlite3-binary is
# Linux-only (no macOS-arm64 wheel), so on macOS the import is unresolved and an
# inline `type: ignore[import-untyped]` becomes an unused-ignore error there.
[[tool.mypy.overrides]]
# Resolved from the same tree via MYPYPATH (scripts/pre-commit.sh); its own errors
# are trw-memory's mypy step's to report, under its own config.
module = ["trw_memory", "trw_memory.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["sqlite_vec", "sqlite_vec.*", "pysqlite3", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = [".hypothesis", "__pycache__", ".git", ".venv", "dist", "build"]
addopts = "--strict-markers --timeout=120 -p no:benchmark --dist loadgroup"
markers = [
    "unit: Fast tests with no filesystem I/O or multi-tool interaction",
    "integration: Tests that write files or call multiple tools together",
    "e2e: End-to-end workflow tests covering full phase sequences",
    "slow: Tests taking >5s individually (bootstrap, consolidation)",
    "smoke: Minimal sanity check tests",
    "requires_published_lock: needs uv.lock refreshed against the published trw-memory; deselected by the paired pre-cut check (release_public.py check --with-local) and by the C1 release gate -- release_public.py all's post-lock-refresh check trw-mcp runs it unfiltered and fails the cut if it fails",
    "requires_local_timing: a host-resource budget (wall-clock, throughput, RSS); skipped on CI runners, measured by the non-gating timing job (PRD-QUAL-141)",
    "live: spawns a real external CLI (agy, grok, codex, claude, ...); always skipped, a manual-probe placeholder only",
    "duration_exempt(reason): exempt a test from the duration budget; reason is required and non-empty (PRD-INFRA-197-FR05)",
]
timeout = 120

[tool.coverage.run]
source = ["trw_mcp"]
core = "sysmon"

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "def main",
    "if __name__",
]
omit = [
    "src/trw_mcp/server/__main__.py",
    "src/trw_mcp/server/_transport.py",
]
